# Overlay used once a kind cluster named dcp is running.
# The container kubeconfig points at https://dcp-control-plane:6443 on the kind network.
# Host kubectl keeps 127.0.0.1 in %USERPROFILE%\.kube\config.
services:
  kubernetes-service:
    volumes:
      - ./infrastructure/kubernetes/kubeconfig.container:/kube/config:ro
    environment:
      KUBECONFIG: /kube/config
    networks:
      - default
      - kind

  prometheus:
    mem_limit: 384m
    volumes:
      - ./infrastructure/monitoring/prometheus.k8s.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infrastructure/monitoring/prometheus/k8s-token:/etc/prometheus/k8s-token:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - kind

networks:
  kind:
    external: true
    name: kind
