apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcp-kubernetes-service
  namespace: dcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcp-workload-manager
  namespace: dcp
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcp-kubernetes-service
  namespace: dcp
subjects:
  - kind: ServiceAccount
    name: dcp-kubernetes-service
    namespace: dcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dcp-workload-manager
