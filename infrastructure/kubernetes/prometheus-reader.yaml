apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-reader
  namespace: dcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dcp-prometheus-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dcp-prometheus-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dcp-prometheus-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-reader
    namespace: dcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-kube-state
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["kube-state-metrics", "kube-state-metrics:8080", "kube-state-metrics:http-metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-kube-state
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-kube-state
subjects:
  - kind: ServiceAccount
    name: prometheus-reader
    namespace: dcp
