    spec:
      containers:
        - name: docker-service
          image: dcp/docker-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: dcp
            - name: SERVER_PORT
              value: "8083"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: MYSQL_PASSWORD
            - name: ENV_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: ENV_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
