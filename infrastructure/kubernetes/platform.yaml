apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: dcp
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: devops-control-plane
    spec:
      containers:
        - name: api-gateway
          image: dcp/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: dcp
            - name: SERVER_PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: MYSQL_PASSWORD
            - name: ENV_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dcp-secrets
                  key: ENV_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: dcp
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
