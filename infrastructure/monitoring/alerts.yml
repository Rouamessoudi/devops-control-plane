groups:
  - name: dcp-services
    rules:
      - alert: MicroserviceDown
        expr: up{job="devops-control-plane"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Microservice {{ $labels.instance }} is down
      - alert: MicroserviceHttpErrors
        expr: sum by (application) (rate(http_server_requests_seconds_count{job="devops-control-plane",status=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate is above 1/s for {{ $labels.application }}
  - name: dcp-kubernetes
    rules:
      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="dcp"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pod {{ $labels.pod }} restarted more than 3 times in 15 minutes
